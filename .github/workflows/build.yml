name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: Prepare project
        run: |
          ls -la
          test -f ScreenInk-v3.zip || { echo "ScreenInk-v3.zip is missing from the repo"; exit 1; }
          unzip -q ScreenInk-v3.zip -d proj
          F=$(find proj -name settings.gradle.kts | head -n1)
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenInk-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
